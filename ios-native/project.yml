name: Rumis
options:
  bundleIdPrefix: com.marcobarroso
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  RumisCore:
    path: RumisCore
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.0.0"
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.0.0"
targets:
  Rumis:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      # XcodeGen no tiene clave `resources:`; los recursos van en `sources` y
      # los mete en la fase de recursos según el tipo de archivo.
      - path: App/Resources
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: RumisCore
        product: RumisCore
      - package: Supabase
        product: Supabase
      - package: Sentry
        product: Sentry
      - package: PostHog
        product: PostHog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcobarroso.rumis
        DEVELOPMENT_TEAM: 3862GT8D5W
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rumies
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
      configs:
        # Release se firma a mano con el certificado y el perfil que crea el
        # titular de la cuenta (Marco es Gestor de apps y no puede usar la firma
        # automática). Debug sigue en automática para el simulador.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Rumies Marco
          CODE_SIGN_ENTITLEMENTS: App/App.Release.entitlements
  RumisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: 3862GT8D5W
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Rumis
